[project]
name = "classlens"
version = "1.0.0"
description = "Multimodal Handwritten Math Diagnostic Platform for Secondary 1 Mathematics"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ClassLens Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "sympy>=1.13.0",
    "pillow>=10.0.0",
    "puremagic>=1.20",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.9",
    "google-adk>=2.11.0",
    "google-genai>=2.29.0",
    "google-auth>=2.30.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient.*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]
